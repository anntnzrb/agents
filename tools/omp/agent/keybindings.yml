# ── Editor ──────────────────────────────────────────────
tui.editor.cursorUp:             [up]             # Move cursor up
tui.editor.cursorDown:           [down]           # Move cursor down
tui.editor.cursorLeft:           [left]           # Move cursor left
tui.editor.cursorRight:          [right]          # Move cursor right
tui.editor.cursorWordLeft:       []               # Move cursor word left
tui.editor.cursorWordRight:      []               # Move cursor word right
tui.editor.cursorLineStart:      [home, ctrl+a]   # Move to line start
tui.editor.cursorLineEnd:        [end, ctrl+e]    # Move to line end
tui.editor.jumpForward:          []]              # Jump forward to character
tui.editor.jumpBackward:         []]              # Jump backward to character
tui.editor.pageUp:               [pageUp]         # Page up
tui.editor.pageDown:             [pageDown]       # Page down
tui.editor.deleteCharBackward:   [backspace]      # Delete character backward
tui.editor.deleteCharForward:    [delete, ctrl+d] # Delete character forward
tui.editor.deleteWordBackward:   []               # Delete word backward
tui.editor.deleteWordForward:    []               # Delete word forward
tui.editor.deleteToLineStart:    []               # Delete to line start
tui.editor.deleteToLineEnd:      []               # Delete to line end
tui.editor.yank:                 []               # Yank
tui.editor.yankPop:              []               # Yank pop
tui.editor.undo:                 []               # Undo

# ── Input ───────────────────────────────────────────────
tui.input.newLine:               [shift+enter, ctrl+j]    # Insert newline
tui.input.submit:                [enter]                  # Submit input
tui.input.tab:                   [tab]                    # Tab / autocomplete
tui.input.copy:                  []                       # Copy selection

# ── Selection ───────────────────────────────────────────
tui.select.up:                   [up]             # Move selection up
tui.select.down:                 [down]           # Move selection down
tui.select.pageUp:               [pageUp]         # Selection page up
tui.select.pageDown:             [pageDown]       # Selection page down
tui.select.confirm:              [enter]          # Confirm selection
tui.select.cancel:               [ctrl+c]         # Cancel selection

# ── Agent ───────────────────────────────────────────────
app.interrupt:                   [escape]         # Interrupt current operation
app.clear:                       [ctrl+c]         # Clear screen or cancel
app.exit:                        []               # Exit application
app.suspend:                     []               # Suspend application

# ── Thinking ────────────────────────────────────────────
app.thinking.cycle:              [shift+tab]      # Cycle thinking level
app.thinking.toggle:             [ctrl+t]         # Toggle thinking mode

# ── Model ───────────────────────────────────────────────
app.model.cycleForward:          [ctrl+p]         # Cycle to next model
app.model.cycleBackward:         [shift+ctrl+p]   # Cycle to previous model
app.model.select:                [ctrl+l]         # Select model
app.model.selectTemporary:       [alt+p]          # Select temporary model

# ── Tools ───────────────────────────────────────────────
app.tools.expand:                [ctrl+o]         # Expand tool output

# ── Editor ──────────────────────────────────────────────
app.editor.external:             [ctrl+g]         # Open external editor

# ── Messages ────────────────────────────────────────────
app.message.followUp:            [ctrl+enter]     # Send follow-up message
app.message.dequeue:             [alt+up]         # Dequeue message

# ── Clipboard ───────────────────────────────────────────
app.clipboard.pasteImage:        [ctrl+v]         # Paste image from clipboard
app.clipboard.pasteTextRaw:      []               # Paste text raw (no collapse)
app.clipboard.copyLine:          []               # Copy current line
app.clipboard.copyPrompt:        [alt+shift+c]    # Copy prompt

# ── Session ─────────────────────────────────────────────
app.session.new:                 []               # Create new session
app.session.tree:                []               # Show session tree
app.session.fork:                []               # Fork session
app.session.resume:              []               # Resume session
app.session.observe:             [ctrl+s]         # Observe subagent sessions
app.session.togglePath:          [ctrl+p]         # Toggle session path display
app.session.toggleSort:          [ctrl+s]         # Toggle session sort order
app.session.rename:              [ctrl+r]         # Rename session
app.session.delete:              [ctrl+d]         # Delete session
app.session.deleteNoninvasive:   [ctrl+backspace] # Delete session (non-invasive)

# ── Tree ────────────────────────────────────────────────
app.tree.foldOrUp:               [ctrl+left, alt+left]   # Fold or move up
app.tree.unfoldOrDown:           [ctrl+right, alt+right] # Unfold or move down

# ── Plan ────────────────────────────────────────────────
app.plan.toggle:                 [alt+shift+p]    # Toggle plan mode

# ── History ─────────────────────────────────────────────
app.history.search:              [ctrl+r]         # Search history

# ── Speech ──────────────────────────────────────────────
app.stt.toggle:                  [alt+h]          # Toggle speech-to-text
