modelRoles: 
  default: openai-codex/gpt-5.4:medium
  smol: openai-codex/gpt-5.4-mini:low
  plan: openai-codex/gpt-5.4:xhigh
  commit: openai-codex/gpt-5.4-mini:low
  task: openai-codex/gpt-5.4-mini:xhigh
  slow: openai-codex/gpt-5.4:xhigh
theme: 
  dark: light-prism
  light: graphite

hideThinkingBlock: true
quietStartup: true
collapseChangelog: true
followUpMode: all
steeringMode: all
interruptMode: wait
compaction: 
  strategy: context-full
branchSummary: 
  enabled: true
doubleEscapeAction: tree
treeFilterMode: no-tools
startup:
  checkUpdate: false
mcp:
  enableProjectConfig: false
  discoveryMode: false
  notifications: false
inspect_image:
  enabled: false
calc:
  enabled: false
checkpoint:
  enabled: false
notebook:
  enabled: false
async:
  enabled: true
renderMermaid:
  enabled: false
fetch:
  enabled: false
web_search:
  enabled: false
browser:
  enabled: false
lsp:
  enabled: false
bashInterceptor:
  enabled: true
  patterns:
    - pattern: "^\\s*(python|python3(?:\\.\\d+)*)\\b"
      tool: python
      message: "python/python3 is disabled. Load `/skill:python`."
    - pattern: "\\bpython(?:3(?:\\.\\d+)*)?\\b"
      tool: python
      message: "Anything invoking python is disabled. Load `/skill:python`."
python:
  toolMode: bash-only
  kernelMode: session
  sharedGateway: true
ttsr:
  enabled: true
  contextMode: discard
  interruptMode: tool-only
  repeatMode: after-gap
  repeatGap: 3
task:
  isolation:
    mode: worktree
    merge: patch
    commits: ai
  eager: true
  maxConcurrency: 8
  maxRecursionDepth: 2
disabledProviders:
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - mcp-json
  - opencode
  - ssh-json
  - vscode
  - windsurf
commands: 
  enableClaudeProject: false
  enableClaudeUser: false
secrets: 
  enabled: true
lastChangelogVersion: 13.14.2
