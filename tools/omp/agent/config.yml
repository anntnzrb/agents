modelRoles: 
  default: openai-codex/gpt-5.4:medium
  smol: openai-codex/gpt-5.4-mini:low
  plan: openai-codex/gpt-5.4:xhigh
  commit: openai-codex/gpt-5.4-mini:low
  task: openai-codex/gpt-5.4-mini:xhigh
  slow: openai-codex/gpt-5.4:xhigh
theme: 
  dark: light-prism
  light: graphite

hideThinkingBlock: true
quietStartup: true
collapseChangelog: true
followUpMode: all
steeringMode: all
interruptMode: wait
compaction: 
  strategy: context-full
branchSummary: 
  enabled: true
doubleEscapeAction: tree
treeFilterMode: no-tools
startup.checkUpdate: false
mcp.enableProjectConfig: false
mcp.discoveryMode: false
mcp.notifications: false
inspect_image.enabled: false
calc.enabled: false
checkpoint.enabled: false
notebook.enabled: false
async: 
  enabled: true
renderMermaid.enabled: false
fetch.enabled: false
web_search.enabled: false
browser.enabled: false
lsp.enabled: false
bashInterceptor.enabled: true
bashInterceptor.patterns:
  - pattern: "^\\s*(python|python3(?:\\.\\d+)*)\\b"
    tool: python
    message: "python/python3 is disabled. Load `/skill:python`."
  - pattern: "\\bpython(?:3(?:\\.\\d+)*)?\\b"
    tool: python
    message: "Anything invoking python is disabled. Load `/skill:python`."
commands: 
  enableClaudeProject: false
  enableClaudeUser: false
secrets: 
  enabled: true
python.toolMode: bash-only
python.kernelMode: session
python.sharedGateway: true
