modelRoles: 
  default: openai-codex/gpt-5.5:low
  smol: opencode-go/mimo-v2.5-pro:high
  plan: openai-codex/gpt-5.5:medium
  commit: opencode-go/mimo-v2.5-pro:high
  task: openai-codex/gpt-5.5:low
  slow: openai-codex/gpt-5.5:medium
theme: 
  dark: light-prism
  light: light-gruvbox

hideThinkingBlock: true
collapseChangelog: true
followUpMode: all
steeringMode: all
interruptMode: wait
doubleEscapeAction: tree
treeFilterMode: no-tools
startup:
  checkUpdate: false
mcp:
  enableProjectConfig: false
  discoveryMode: false
  notifications: false
lsp:
  enabled: false
bashInterceptor:
  enabled: true
  patterns:
    - pattern: "^\\s*(python|python3(?:\\.\\d+)*)\\b"
      tool: python
      message: "python/python3 is disabled. Load `/skill:python`."
    - pattern: "\\bpython(?:3(?:\\.\\d+)*)?\\b"
      tool: python
      message: "Anything invoking python is disabled. Load `/skill:python`."
disabledProviders:
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - mcp-json
  - opencode
  - ssh-json
  - vscode
  - windsurf
commands: 
  enableClaudeProject: false
  enableClaudeUser: false
secrets: 
  enabled: true
lastChangelogVersion: 13.14.2
