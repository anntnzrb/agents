# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# do not emit thinking blocks (visually)
hide_agent_reasoning = true

web_search = "disabled"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------

model = "gpt-5.5"
review_model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "detailed"
model_personality = "pragmatic"

# -----------------------------------------------------------------------------
# PERMISSIONS
# -----------------------------------------------------------------------------

approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
exclude_slash_tmp = false
network_access = true

[shell_environment_policy]
# "all", "core", "none"
inherit = "core"

# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------

[features]
apply_patch_freeform = true # EXP
child_agents_md = true # EXP
multi_agent = true
personality = true # EXP
shell_snapshot = true
sqlite = true # EXP
undo = true # EXP
unified_exec = true
default_mode_request_user_input = true

# steer = ENTER ; queue = TAB
steer = true

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------

[agents]
max_threads = 8
max_depth = 1

[agents.explorer]
description = "Use `explorer` for specific codebase questions."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Use for execution and production work."
config_file = "agents/worker.toml"

# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------

[history]
persistence = "save-all"

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = true
