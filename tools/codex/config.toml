# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# do not emit thinking blocks (visually)
hide_agent_reasoning = true

web_search = "live"
followUpQueueMode = "queue"

# -----------------------------------------------------------------------------
# PROVIDERS
# -----------------------------------------------------------------------------

[model_providers.opencode-go]
name = "OpenCode Go"
base_url = "https://opencode.ai/zen/go/v1"
wire_api = "responses"
env_key = "OPENCODE_GO_API_KEY"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------

model = "gpt-5.6-luna"
review_model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_verbosity = "low"
model_reasoning_summary = "detailed"
personality = "pragmatic"

# -----------------------------------------------------------------------------
# APPEARANCE
# -----------------------------------------------------------------------------

appearanceLightCodeThemeId = "rose-pine"
appearanceTheme = "system"
appearanceDarkCodeThemeId = "matrix"

# light theme
[desktop.appearanceLightChromeTheme]
accent = "#d7827e"
contrast = 45
ink = "#575279"
opaqueWindows = false
surface = "#faf4ed"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#56949f"
diffRemoved = "#797593"
skill = "#907aa9"

# dark theme
[desktop.appearanceDarkChromeTheme]
accent = "#1eff5a"
contrast = 60
ink = "#b8ffca"
opaqueWindows = true
surface = "#040805"

[desktop.appearanceDarkChromeTheme.fonts]
ui = 'ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#1eff5a"
diffRemoved = "#fa423e"
skill = "#1eff5a"

# -----------------------------------------------------------------------------
# PERMISSIONS
# -----------------------------------------------------------------------------

approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
exclude_slash_tmp = false
network_access = true

[shell_environment_policy]
# "all", "core", "none"
inherit = "core"

# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------

[features]
chronicle = false
default_mode_request_user_input = true
memories = false
plugins = true
prevent_idle_sleep = true

[memories]
generate_memories = false
use_memories = false

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

# -----------------------------------------------------------------------------
# TUI
# -----------------------------------------------------------------------------

[tui]
alternate_screen = "never"
vim_mode_default = true
status_line = ["model-with-reasoning", "current-dir", "git-branch", "run-state", "context-used", "codex-version", "task-progress"]
status_line_use_colors = true

# -----------------------------------------------------------------------------
# DESKTOP
# -----------------------------------------------------------------------------

[desktop]
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max"]

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------

[agents]
enabled = true
max_concurrent_threads_per_session = 32
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
interrupt_message = true

# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------

[history]
persistence = "save-all"

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = true
