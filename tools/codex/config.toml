# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# do not emit thinking blocks (visually)
hide_agent_reasoning = true

web_search = "live"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------

model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
model_reasoning_summary = "detailed"
personality = "pragmatic"

# -----------------------------------------------------------------------------
# PERMISSIONS
# -----------------------------------------------------------------------------

approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
exclude_slash_tmp = false
network_access = true

[shell_environment_policy]
# "all", "core", "none"
inherit = "core"

# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------

[features]
memories = true
prevent_idle_sleep = true
default_mode_request_user_input = true

[tools.web_search]
context_size = "medium"

[tui]
alternate_screen = "never"
vim_mode_default = true
status_line = ["model-with-reasoning", "current-dir", "git-branch", "run-state", "context-used", "codex-version", "task-progress"]
status_line_use_colors = true

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------

[agents]
# Root + up to three bounded subagents. More tends to add merge/review noise.
max_threads = 4
max_depth = 1

[agents.explorer]
description = "Read-only codebase reconnaissance, dependency tracing, and test triage. Do not edit files."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Implement a bounded, well-scoped change and run relevant validation."
config_file = "agents/worker.toml"

[agents.reviewer]
description = "Review diffs, test evidence, and failure modes. Do not edit files unless explicitly asked."
config_file = "agents/reviewer.toml"

# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------

[history]
persistence = "save-all"

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = true
