# Operational tuning for the orchestration hook.
#
# These values are intentionally separate from the Codex hook protocol in
# hooks.json and from the Python implementation. Change policy here first;
# use CODEX_ORCHESTRATION_<UPPER_SNAKE_CASE_KEY> only for temporary per-machine
# or test overrides.

[orchestration]

# Total spawn attempts allowed in one session by the hook. This is separate
# from Codex's active child-thread concurrency setting in config.toml.
spawn_cap = 16

# Number of invalid-evidence retries before the hook fails open.
evidence_retries = 1

# Maximum transcript bytes inspected for compaction recovery and worker output.
session_transcript_tail_bytes = 65536
agent_transcript_tail_bytes = 32768

# Lock acquisition and stale-lock cleanup policy.
lock_attempts = 40
lock_stale_seconds = 5.0
lock_sleep_milliseconds = 5
