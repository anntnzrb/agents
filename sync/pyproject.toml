[project]
name = "agents-sync"
version = "0.1.0"
description = "Reconcile AI agent configurations, skills, and harness environments from SSOT"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.10.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.1",
]
[project.scripts]
sync = "sync.cli:main_sync_entry"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownArgumentType = true
reportAny = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto -q"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.9.0",
  "pyright>=1.1.390",
]
