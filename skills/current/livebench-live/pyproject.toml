[project]
name = "livebench-live"
version = "0.1.0"
description = "Live LiveBench benchmark data via CLI"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["lib", "scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "COM812",
    "CPY001",  # docs/skills.md forbids license headers in non-Markdown files
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "T201",
    "INP001",  # scripts/ is a standalone PEP 723 entrypoint directory, not a package
    "E402",    # sys.path must be updated before importing livebench from lib/
]
"tests/**/*.py" = [
    "S101",
    "D",        # test modules and test methods do not require docstrings
    "INP001",   # tests/ is a pytest test root, not an installed package
    "PLR2004",  # deterministic fixture tests assert concrete expected constants
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["lib", "scripts", "tests"]
extraPaths = ["lib", "scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
