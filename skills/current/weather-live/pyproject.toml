[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", # Repository policy prohibits copyright headers.
  "A002", "COM812", "D203", "D213", "EM101", "EM102", "ERA001", "PERF401", "PLR0911", "PLR0912", "S101", "S603", "S607", "SLF001", "TRY003", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201"]
"tests/**/*.py" = ["S101", "D", "PLR2004", "PLR0913", "PLR0917", "FBT001"] # Test cases use descriptive names and literal expectations.
"lib/weather_live/__init__.py" = ["T201", "ISC003"] # CLI output; explicit concatenation satisfies basedpyright.

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib", "scripts"]
pythonVersion = "3.14"
pythonPlatform = "All"

[tool.pytest.ini_options]
pythonpath = ["lib"]
