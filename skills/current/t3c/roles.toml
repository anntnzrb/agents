# Per-instance role map for t3c. Edit this file to change roles and routing.
# role: the delegate_task role value.
# use_for and not_for: when the orchestrator picks this role.
# provider: T3 providerInstanceId from orchestrator_capabilities.
# options: passed verbatim as delegate_task target.options.
# retry_options: replaces options on the single escalation retry.
# Tables are ordered by importance, most important first.

[implementer]
role = "implementation"
use_for = "Parallel logic slices with disjoint files, implementation or debugging whose context the orchestrator has not loaded, and any slice the scout failed, each checked with one targeted command for its own slice"
not_for = "Changes whose context the orchestrator already holds, full test suites, and CI gates"
provider = "codex"
model = "gpt-6.1-terra"
options = { reasoningEffort = "medium" }

[reviewer]
role = "review"
use_for = "A code diff that changes behavior, before the orchestrator reports it done"
not_for = "Prose-only, mechanical, or typo-sized diffs"
provider = "codex"
model = "gpt-6.1-sol"
options = { reasoningEffort = "medium" }

[scout]
role = "research"
use_for = "Read-only work: recon, code search, summaries, web research, running the verification commands the orchestrator names, such as full test suites, builds, linters, CI gates, and CI waits, then reporting pass or fail with trimmed failure output, and review of prose-only or mechanical diffs when the user asks for one"
not_for = "Edits of any kind, fixing failures, choosing which checks to run, debugging, logic changes, and one quick targeted check the orchestrator runs itself"
provider = "opencode"
model = "cliproxy/gemini-3.8-flash-high"
options = { variant = "high" }
