[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "COM812",
    "CPY001",  # Repository convention does not use per-file copyright headers
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "T201",
    "INP001",  # Standalone CLI script is an entrypoint, not a regular module package
]
"tests/**/*.py" = [
    "S101",
    "ARG001",  # Unused arguments in monkeypatch / mock fixture signatures
    "ARG002",  # Unused method arguments in fake SDK mock classes
    "ARG005",  # Unused arguments in dummy lambda callbacks
    "D100",    # Test files do not require module-level docstrings
    "D102",    # Test methods are self-documenting by their function name
    "D103",    # Nested test helper functions are self-documenting
    "INP001",  # Tests directory is not distributed as an import package
    "PLR2004", # Magic literal values are idiomatic in test assertion targets
    "PT009",   # Specific pytest assertion styles permitted in unit test suites
]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
pythonVersion = "3.15"
typeCheckingMode = "all"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib", "."]
pythonPlatform = "All"
reportMissingTypeStubs = false  # firecrawl-py does not distribute py.typed stubs

# Tests deliberately exercise internal helpers directly
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false  # Tests deliberately exercise private helper functions
[tool.pytest.ini_options]
pythonpath = ["lib", "."]
testpaths = ["tests"]
