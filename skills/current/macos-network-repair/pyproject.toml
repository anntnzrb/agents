[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "COM812",
    "CPY001",  # repo policy: no license or copyright headers in code files
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001"]
"lib/fixnet/network.py" = ["T201"]
"tests/**/*.py" = ["S101", "PLR2004", "PT027"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib"]
pythonVersion = "3.14"
pythonPlatform = "All"

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
