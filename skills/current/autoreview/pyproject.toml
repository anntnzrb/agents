[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "C901",  # complex git bundle capture and review dispatch
    "COM812",
    "CPY001",  # repo policy: no license or copyright headers in code files
    "D100",  # docstrings optional on internal modules
    "D101",  # docstrings optional on internal classes
    "D102",  # docstrings optional on internal methods
    "D103",  # docstrings optional on internal functions
    "D104",  # docstrings optional on internal packages
    "D203",
    "D213",
    "E501",  # long prompt and regex strings
    "EM101",
    "EM102",
    "ERA001",
    "FBT001",  # boolean flags in git helpers
    "FBT002",  # boolean defaults in git helpers
    "PERF401",
    "PLR0911",
    "PLR0912",
    "PLR0915",  # multi-step bundle and CLI functions
    "RUF012",  # schema dictionary constant
    "S101",
    "S603",
    "S607",
    "SIM108",  # explicit if/else preferred for readability
    "SLF001",
    "TC001",  # runtime application imports preferred for simplicity
    "TC003",  # runtime stdlib imports preferred for simplicity
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001", "EXE002"]
"lib/**/*.py" = ["T201"]
"tests/**/*.py" = ["S101", "ANN", "ARG", "E402", "INP001", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib"]
pythonVersion = "3.14"
pythonPlatform = "All"

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
