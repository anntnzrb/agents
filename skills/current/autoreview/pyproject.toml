[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001"]
"tests/**/*.py" = ["S101", "ANN", "ARG", "E402", "INP001"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib"]
pythonVersion = "3.12"
pythonPlatform = "All"
reportMissingImports = false
