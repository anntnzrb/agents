[project]
name = "git-worktrees"
version = "0.1.0"
description = "Local raw-Git worktree lifecycle CLI"
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["lib", "scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "ISC003", "D203", "D213", "CPY001", "FBT001", "FBT002",
          "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
# unittest-style suite (repo precedent: PT009); live-git CLI tests (S603/S607).
"tests/**/*.py" = ["S101", "ANN", "ARG", "ARG001", "ARG005", "PLC0415",
  "PLR2004", "PLR0913", "PT009", "SLF001", "D", "TRY003", "TRY004", "EM101", "EM102",
  "E402", "S603", "S607"]
"scripts/**/*.py" = ["T201", "INP001", "E402", "I001"]
# Coded CliError/InputError/GitError use literal codes by design (TRY003 kept).
"lib/git_worktrees/cli.py" = ["EM101", "C901", "PLR0911", "PLR0912", "PLC0415"]
"lib/git_worktrees/controller.py" = ["EM101", "PLC0415"]
# git(1) wrapper: fixed argv, shell=False; porcelain parser is inherently branchy.
"lib/git_worktrees/git.py" = ["EM101", "S603", "S607", "C901", "PLR0911", "PLR0912", "PLR0915"]
# Validator-heavy service: early-return ladders covered by behavior tests.
"lib/git_worktrees/service.py" = ["EM101", "C901", "PLR0911", "PLR0912"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["lib", "scripts", "tests"]
extraPaths = ["lib", "scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
