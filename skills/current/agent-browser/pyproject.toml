[project]
name = "agent-browser"
version = "0.1.0"
description = "Cross-platform wrapper for agent-browser via nix flake"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "COM812",
    "CPY001",  # repo policy: no license or copyright headers in code files
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001", "E402", "I001", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["scripts"]
extraPaths = ["scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
