[project]
name = "odoo-ops"
version = "0.1.0"
description = "Public entrypoint and dispatcher for Odoo Ops"
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "ISC003", "D203", "D213", "CPY001", "FBT001", "FBT002",
          "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_*.py" = ["S101", "ANN", "ARG", "ARG001", "ARG005", "PLC0415",
  "PLR2004", "PLR0913", "SLF001", "D", "TRY003", "TRY004", "EM101", "EM102",
  "E402", "S603", "S607"]
"scripts/odooctl.py" = ["T201", "INP001", "E402", "I001"]
"scripts/odoo_rpc.py" = ["T201", "INP001", "E402", "I001"]
"scripts/cli.py" = ["T201", "INP001", "E402", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.10"
pythonPlatform = "All"
include = ["scripts"]
extraPaths = ["scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["scripts"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
