[project]
name = "mneme"
version = "0.1.0"
description = "Process transcripts losslessly, synthesize specs, and query meeting history"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "COM812",
    "CPY001",  # repo policy: no license or copyright headers in code files
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001", "D103", "D401"]
"tests/**/*.py" = [
  "ANN",
  "ARG",
  "D",
  "PLR2004",
  "S101",
  "SLF001",
  "TC",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["scripts", "tests"]
extraPaths = ["scripts"]
pythonVersion = "3.14"
pythonPlatform = "All"
