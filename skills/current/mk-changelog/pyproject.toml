[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "C901",  # complex CLI and changelog parsing logic
    "COM812",
    "CPY001",  # repo policy: no license or copyright headers in code files
    "D100",  # docstrings optional on internal modules
    "D101",  # docstrings optional on internal classes
    "D102",  # docstrings optional on internal methods
    "D103",  # docstrings optional on internal functions
    "D104",  # docstrings optional on internal packages
    "D203",
    "D213",
    "E501",  # long changelog prompt and regex strings
    "EM101",
    "EM102",
    "ERA001",
    "FBT001",  # boolean flags in CLI helpers
    "FBT002",  # boolean defaults in CLI helpers
    "PERF401",
    "PLR0911",
    "PLR0912",
    "PLR0915",  # multi-step CLI handlers
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TC003",  # runtime stdlib imports preferred for simplicity
    "TRY003",
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "INP001"]
"tests/**/*.py" = ["S101", "PT009", "ANN", "ARG", "E402", "INP001", "FBT001", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["scripts", "lib", "tests"]
extraPaths = ["lib"]
pythonVersion = "3.14"
pythonPlatform = "All"

[tool.pytest.ini_options]
pythonpath = ["lib", "."]
testpaths = ["tests"]
