[project]
name = "vals-live"
version = "0.1.0"
description = "Live Vals benchmark data via CLI"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["lib", "scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Template ignores from docs/skills.md
    "A002",
    "COM812",
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ERA001",
    "PERF401",
    "PLR0911",
    "PLR0912",
    "S101",
    "S603",
    "S607",
    "SLF001",
    "TRY003",
    "TRY301",
    # Skill-specific justified ignores:
    "ISC001",  # Formatter conflict with single-line string concatenation
    "ISC003",  # Explicit string concatenation used for readability
    "CPY001",  # Existing files do not all have file-header copyright notices
    "FBT001",  # Boolean-typed positional arguments in existing internal signatures
    "FBT002",  # Boolean default positional arguments in existing internal signatures
    "TD002",   # Existing TODOs without author
    "TD003",   # Existing TODOs without issue links
    "FIX002",  # Allow existing TODO markers
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "ARG", "ARG001", "ARG005", "PLC0415",
  "PLR2004", "PLR0913", "SLF001", "D", "TRY003", "TRY004", "EM101", "EM102",
  "E402", "S603", "S607"]
"scripts/**/*.py" = ["T201", "INP001", "E402", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["lib", "scripts", "tests"]
extraPaths = ["lib", "scripts", "tests"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
