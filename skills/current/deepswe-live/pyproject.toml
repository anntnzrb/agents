[project]
name = "deepswe-live"
version = "0.1.0"
description = "Live DeepSWE benchmark data via CLI"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["lib", "scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Template ignores from docs/skills.md
    "A002", "COM812", "D203", "D213", "EM101", "EM102", "ERA001", "PERF401",
    "PLR0911", "PLR0912", "S101", "S603", "S607", "SLF001", "TRY003", "TRY301",
    # Extra existing ignores with justifications
    "CPY001",  # No copyright headers in non-markdown files per repository policy
    "ISC001",  # Recommended ignore to avoid conflict with ruff formatter
    "ISC003",  # Explicitly concatenated strings preferred in certain CLI formatters
    "FBT001",  # Existing API signatures accept boolean flags
    "FBT002",  # Existing API signatures accept boolean flags
    "TD002",   # Existing TODO comments lack authors
    "TD003",   # Existing TODO comments lack issue links
    "FIX002",  # Existing TODO comments tolerated
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Assert allowed in tests
    "ANN",      # Test functions and fixtures do not need full annotations
    "ARG",      # Test fixtures may be unused directly in test bodies
    "ARG001",   # Unused test argument
    "ARG005",   # Unused lambda argument
    "PLC0415",  # Late import inside test functions
    "PLR2004",  # Magic value comparison in assertions
    "PLR0913",  # Many parameters in test helper functions
    "SLF001",   # Private member testing
    "D",        # Docstrings not required for tests
    "TRY003",   # Long message in raise
    "TRY004",   # Specific exception types in test assertions
    "EM101",    # String literal in exception
    "EM102",    # F-string in exception
    "E402",     # Path manipulation before import in test bootstrap
    "S603",     # Subprocess call in tests
    "S607",     # Subprocess call with partial path in tests
]
"scripts/**/*.py" = [
    "T201",    # Print statements allowed in standalone CLI script
    "INP001",  # scripts/ is not a Python package
    "E402",    # sys.path mutation before import in script entrypoint
    "I001",    # Import order depends on sys.path mutation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["lib", "scripts", "tests"]
extraPaths = ["lib", "scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
