name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: false }
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with: { tool: "cargo-nextest" }
      - name: Run the base branch's governance check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:.gate/governance-check.py" > "$RUNNER_TEMP/governance-check.py"
          uv run --script "$RUNNER_TEMP/governance-check.py" "origin/${BASE_REF}" --inventory

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with: { tool: "cargo-nextest,cargo-deny,cargo-machete" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: uv run --script .gate/governance-check.py --doctests
      - run: cargo doc --no-deps --workspace --all-features --locked
        env: { RUSTDOCFLAGS: "-D warnings" }
      - run: cargo deny --locked check
      - run: cargo machete

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with: { tool: "cargo-mutants,cargo-nextest" }
      - name: Test mutations in the pushed or pull request diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          RUSTC_WORKSPACE_WRAPPER: ${{ runner.temp }}/cap-lints-rustc
          CARGO_TARGET_DIR: ${{ runner.temp }}/mutants-target
        run: |
          printf '%s\n' '#!/bin/sh' 'exec "$@" --cap-lints=warn' > "$RUNNER_TEMP/cap-lints-rustc"
          chmod 700 "$RUNNER_TEMP/cap-lints-rustc"
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            git diff "$(git hash-object -t tree /dev/null)" HEAD > "$RUNNER_TEMP/pr.diff"
          else
            git diff "${BASE}...HEAD" > "$RUNNER_TEMP/pr.diff"
          fi
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --test-tool nextest --output "$RUNNER_TEMP"

  # Enable when the workspace contains unsafe code Miri can execute.
  # Package selection follows scripts/cli.py gate and trusted escape-hatch paths.
