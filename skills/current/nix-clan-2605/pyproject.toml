[project]
name = "nix-clan-2605"
version = "0.1.0"
description = "Clan documentation updater"
readme = "SKILL.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["lib", "scripts", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A002",
  "CPY001", # docs/skills.md: No license headers in non-Markdown files
  "COM812",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "ERA001",
  "FBT001", # Existing internal helpers use boolean positional arguments
  "FBT002", # Existing internal helpers use boolean default positional arguments
  "ISC001", # Ruff formatter conflict recommendation
  "ISC003", # Existing code uses explicit string concatenation
  "PERF401",
  "PLR0911",
  "PLR0912",
  "S101",
  "S603",
  "S607",
  "SLF001",
  "TRY003",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "ARG", "ARG001", "ARG005", "PLC0415",
  "PLR2004", "PLR0913", "SLF001", "D", "TRY003", "TRY004", "EM101", "EM102",
  "E402", "S603", "S607"]
"lib/nix_clan_updater/cli.py" = ["T201"]
"lib/nix_clan_updater/core.py" = ["S603", "S607"]
"scripts/**/*.py" = ["T201", "INP001", "E402", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["lib", "scripts", "tests"]
extraPaths = ["lib", "scripts"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"

# tests deliberately exercise private markdown rewriting helpers
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
