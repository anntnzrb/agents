[project]
name = "vox-interpres"
version = "0.1.0"
description = "Analyze audio and answer deterministic Q&A over extracted musical features."
requires-python = ">=3.11,<3.15"
dependencies = [
  "audioread>=3.0.1",
  "librosa>=0.11.0",
  "numpy>=2.0.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
plots = [
  "matplotlib>=3.8.0",
]

[project.scripts]
vox-interpres = "vox_interpres.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11.0",
  "pyright>=1.1.0",
  "matplotlib>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
