[tool.ruff]
target-version = "py312"
extend-exclude = ["data"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["scripts", "tests"]
exclude = ["data", "scripts/validate_shortcut.py", "scripts/select_shortcut_icon_color.py"]
extraPaths = ["scripts"]
