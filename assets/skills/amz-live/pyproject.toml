[project]
name = "amz-live"
version = "0.1.0"
description = "Tiny read-only CLI for live Amazon catalog search."
readme = "README.md"
requires-python = ">=3.14,<3.15"
keywords = ["amazon", "cli", "search", "uv"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.28.1",
  "selectolax>=0.3.26",
]

[project.scripts]
amz-live = "amz_live.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.0",
  "pyright>=1.1.0",
  "pytest>=8.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = [".venv", "build", "dist"]


[tool.pytest.ini_options]
addopts = "-ra"
