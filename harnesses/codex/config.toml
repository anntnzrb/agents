# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# do not emit thinking blocks (visually)
hide_agent_reasoning = true
suppress_unstable_features_warning = true

web_search = "live"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------

model = "gpt-5.6-sol"
model_provider = "cliproxy"
review_model = "gpt-5.6-luna"
model_reasoning_effort = "high"
model_verbosity = "low"
model_reasoning_summary = "detailed"
personality = "pragmatic"

# -----------------------------------------------------------------------------
# PERMISSIONS
# -----------------------------------------------------------------------------

approval_policy = "never"
default_permissions = ":danger-full-access"

developer_instructions = """
You are the primary coordinator. Prefer delegating substantial or independent work to a registered implementation worker (worker-medium or worker-high), while retaining responsibility for scope, synthesis, integration, and verification.
Use direct commands and edits when they are the smallest or fastest in-scope path.
When local read tools are unavailable, delegate filesystem inspection to the registered explorer agent.
"""

[model_providers.cliproxy]
name = "CLIProxyAPI"
base_url = "${CLIPROXY_CLIENT_BASE_URL}"
wire_api = "responses"

[model_providers.cliproxy.auth]
command = "cat"
args = ["client-api-key"]
cwd = "~/.local/share/agents/cliproxyapi"
refresh_interval_ms = 0

[permissions.agent-workspace]
extends = ":workspace"

[permissions.agent-workspace.filesystem]
"~/.local/share/agents/codex/runs" = "write"

[permissions.agent-workspace.network]
enabled = true

[permissions.agent-workspace.network.domains]
"*" = "allow"

[permissions.agent-review]
extends = ":read-only"

[permissions.agent-review.filesystem]
"~/.local/share/agents/codex/runs" = "write"

# light theme
[desktop.appearanceLightChromeTheme]
accent = "#d7827e"
contrast = 45
ink = "#575279"
opaqueWindows = false
surface = "#faf4ed"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#56949f"
diffRemoved = "#797593"
skill = "#907aa9"

# dark theme
[desktop.appearanceDarkChromeTheme]
accent = "#1eff5a"
contrast = 60
ink = "#b8ffca"
opaqueWindows = true
surface = "#040805"

[desktop.appearanceDarkChromeTheme.fonts]
ui = 'ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#1eff5a"
diffRemoved = "#fa423e"
skill = "#1eff5a"

[shell_environment_policy]
# "all", "core", "none"
inherit = "core"

# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------

[features]
chronicle = false
default_mode_request_user_input = true
hooks = true
memories = false
plugins = true
prevent_idle_sleep = true

[memories]
generate_memories = false
use_memories = false

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

# -----------------------------------------------------------------------------
# TUI
# -----------------------------------------------------------------------------

[tui]
alternate_screen = "never"
vim_mode_default = false
status_line = ["model-with-reasoning", "current-dir", "git-branch", "run-state", "context-used", "codex-version", "task-progress"]
status_line_use_colors = true

# -----------------------------------------------------------------------------
# DESKTOP
# -----------------------------------------------------------------------------

[desktop]
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max"]

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------

[agents]
enabled = true
# Active child threads at one time, excluding the primary agent. This is a
# throughput/context budget, not the number of agent definitions or the total
# number of workers a session may use over its lifetime. The hook's separate
# lifetime spawn-attempt cap lives in hooks/orchestration.toml.
max_concurrent_threads_per_session = 16
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
interrupt_message = true

# (see codex-rs issue #32031)
[multi_agent_v2]
hide_spawn_agent_metadata = false
expose_spawn_agent_model_overrides = true

# Orchestrator guidance: scope, decompose, delegate, synthesize, verify.
root_agent_usage_hint_text = """You are the orchestrator only. Never edit files, never call apply_patch, and never run shell commands that mutate state directly. Decompose the task, plan, and delegate ALL concrete work to a registered implementation worker. You own scope, synthesis, integration, and verification — not execution."""

# Worker (Luna) guidance: own all writes and changes; never re-delegate upward.
subagent_developer_instructions = """You are an execution worker. Own every concrete change and write directly. Never re-delegate work back to the orchestrator. Only report scope, synthesis-level blockers, and verification evidence."""

[agents.explorer]
description = "Read-only codebase explorer that returns structured evidence."
config_file = "agents/explorer.toml"

[agents.code-reviewer]
description = "Read-only code-quality reviewer with artifact-backed findings."
config_file = "agents/code-reviewer.toml"

[agents.qa-executor]
description = "Manual QA executor that runs real scenarios and records evidence."
config_file = "agents/qa-executor.toml"

[agents.worker-high]
description = "Implementation worker for large, complex changes with one clear goal."
config_file = "agents/worker-high.toml"

[agents.worker-medium]
description = "Implementation worker for mid-sized changes that follow established patterns."
config_file = "agents/worker-medium.toml"

# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------

[history]
persistence = "save-all"

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = true
