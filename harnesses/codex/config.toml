# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# do not emit thinking blocks (visually)
hide_agent_reasoning = true
suppress_unstable_features_warning = true

web_search = "live"

developer_instructions = """
When acting as the primary agent on non-trivial work, proactively delegate independent tasks to multiple explorer and worker agents when that improves throughput.
Use explorers for read-only investigation and workers for bounded implementation. Spawn multiple instances of either role as needed within the configured child-thread limit; do not fill slots without useful independent work.
For broad tasks, launch independent exploration lanes together before repeated serial investigation. Stop exploring once the findings are sufficient to act.
Give each child a self-contained brief naming TASK, DELIVERABLE, SCOPE, VERIFY, and STOP WHEN. Assign workers explicit file ownership; use separate worktrees when edits would overlap.
Prefer self-contained briefs with no inherited history or only the relevant recent turns when sufficient. Reuse existing agents for related follow-up tasks.
Continue independent work while children run. Wait only when a result is required for the next dependent step, and collect all required results before declaring completion.
Treat a wait timeout as no new message, not child failure. Avoid repeated status polling; use completion messages and useful independent work. Re-task stalled or incomplete children with a smaller assignment and report unresolved blockers.
Keep delegation centralized in the primary agent. Children must not spawn further agents.
The primary agent owns integration: inspect actual changes and evidence, resolve conflicts, and verify the combined result. Follow explicit user limits or requests to avoid delegation; handle trivial tasks directly.
"""

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------

model = "gpt-6.1-sol"
model_provider = "cliproxy"
review_model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "detailed"
personality = "pragmatic"

# -----------------------------------------------------------------------------
# PERMISSIONS
# -----------------------------------------------------------------------------
# These MUST stay above the first table header below; TOML keys after a table
# header belong to that table, which silently disabled both settings.

approval_policy = "never"
default_permissions = ":danger-full-access"

# -----------------------------------------------------------------------------
# PROVIDERS
# -----------------------------------------------------------------------------

[model_providers.cliproxy]
name = "CLIProxyAPI"
base_url = "${CLIPROXY_CLIENT_BASE_URL}"
wire_api = "responses"
supports_websockets = true

# Command-backed auth flags the provider as fetching its model catalog:
# codex then pulls {base_url}/models?client_version=... (which CLIProxyAPI serves
# as a native Codex catalog) instead of relying on the bundled catalog alone.
# The token value is ignored by the keyless gateway; point command at a key file
# if api-keys are ever enabled upstream.
[model_providers.cliproxy.auth]
command = "echo"
args = ["cliproxy"]

# light theme
[desktop.appearanceLightChromeTheme]
accent = "#d7827e"
contrast = 45
ink = "#575279"
opaqueWindows = false
surface = "#faf4ed"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#56949f"
diffRemoved = "#797593"
skill = "#907aa9"

# dark theme
[desktop.appearanceDarkChromeTheme]
accent = "#1eff5a"
contrast = 60
ink = "#b8ffca"
opaqueWindows = true
surface = "#040805"

[desktop.appearanceDarkChromeTheme.fonts]
ui = 'ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#1eff5a"
diffRemoved = "#fa423e"
skill = "#1eff5a"

[shell_environment_policy]
# "all", "core", "none"
inherit = "all"

# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------

[features]
chronicle = false
code_mode_host = true
# Sync ensures the native daemon is running on opted-in SSH hosts.
daemon_auto_start = false
default_mode_request_user_input = true
hooks = false
memories = false
plugins = true
prevent_idle_sleep = true
recommended_plugins = true
worktrees = true

[memories]
generate_memories = false
use_memories = false

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

# -----------------------------------------------------------------------------
# TUI
# -----------------------------------------------------------------------------

[tui]
alternate_screen = "never"
vim_mode_default = false
status_line = ["model-with-reasoning", "current-dir", "git-branch", "run-state", "context-used", "codex-version", "task-progress"]
status_line_use_colors = true

# -----------------------------------------------------------------------------
# DESKTOP
# -----------------------------------------------------------------------------

[desktop]
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------

[agents]
enabled = true
interrupt_message = true
max_concurrent_threads_per_session = 12

[features.multi_agent_v2]
enabled = true

# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------

[history]
persistence = "save-all"

[analytics]
enabled = false

[feedback]
enabled = false

[notice]
hide_rate_limit_model_nudge = true
