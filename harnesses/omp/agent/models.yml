providers:
  cliproxy:
    # Select gateway models as cliproxy/<id>; a bare prefix can resolve to a native
    # provider instead (for example opencode-zen), bypassing the gateway.
    baseUrl: "${CLIPROXY_CLIENT_BASE_URL}"
    apiKey: keyless
    api: openai-completions
    discovery:
      # The gateway's /v1/models marks Claude models that /v1/messages serves natively with
      # supported_endpoint_types; proxy discovery routes those to anthropic-messages and keeps
      # the rest on openai-completions. It also reports context_length per model.
      type: proxy
    modelOverrides:
      gemini-3.7-flash-high:
        contextWindow: 500000 # 500K * 85% = 425K trigger, keeping Flash within high-precision reasoning limits; matches the google-antigravity profile
      gemini-3.8-flash-high:
        contextWindow: 500000 # 500K * 85% = 425K trigger; matches the google-antigravity profile
        cost:
          input: 0.75
          output: 3.75
          cacheRead: 0.075
          cacheWrite: 0
      gpt-6-astra:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Astra's 100% needle-and-aggregation zone; matches the openai-codex profile
        # Proxy discovery disables effort by default; these GPT routes accept reasoning_effort.
        compat:
          supportsReasoningEffort: true
      gpt-6.1-sol:
        reasoning: true
        contextWindow: 320000 # 320K * 85% = 272K trigger, compacting at OpenAI's long-context pricing line (>272K input bills 2x input / 1.5x output)
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
        thinking:
          mode: effort
          efforts:
            - medium
        input:
          - text
          - image
        cost:
          input: 2
          output: 10
          cacheRead: 0.1
          cacheWrite: 2.5
      claude-opus-5-5:
        cost:
          input: 4
          output: 20
          cacheRead: 0.2
          cacheWrite: 5
        # Director always thinks at medium: auto thinking and ultrathink resolve to it; ultrathink keeps its notice.
        thinking:
          mode: effort
          efforts:
            - medium
      claude-sonnet-5-5:
        cost:
          input: 2
          output: 10
          cacheRead: 0.2
          cacheWrite: 2.5
        thinking:
          mode: effort
          efforts:
            - high
      command-code/deepseek/deepseek-v4.1-flash:
        reasoning: true
        contextWindow: 1000000 # 1M * 85% = 850K trigger, server-advertised 1M window / 384K max output
        thinking:
          mode: effort
          efforts:
            - low
            - high
            - max
          defaultLevel: max
        input:
          - text
          - image
      opencode-go/muse-spark-1.3-contributor:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Muse 1.3's 98.5% MRCR recall zone
        thinking:
          mode: effort
          efforts:
            - xhigh
          defaultLevel: xhigh
        input:
          - text
          - image
      devin/swe-2:
        reasoning: true
        contextWindow: 262000
        thinking:
          mode: effort
          efforts:
            - medium
            - high
            - max
          defaultLevel: max
          requiresEffort: true
        input:
          - text
          - image
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
  google-antigravity:
    modelOverrides:
      gemini-3.7-flash:
        contextWindow: 500000 # 500K * 85% = 425K trigger, keeping Flash within high-precision reasoning limits
      gemini-3.8-flash:
        contextWindow: 500000 # 500K * 85% = 425K trigger
  opencode-go:
    modelOverrides:
      glm-5.3-flash:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
      muse-spark-1.3-contributor:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Muse 1.3's 98.5% MRCR recall zone
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
      deepseek-v4.1-flash:
        contextWindow: 1000000 # 1M * 85% = 850K trigger, server-advertised 1M window / 384K max output
        thinking:
          mode: effort
          efforts:
            - low
            - high
            - max
          defaultLevel: max
        input:
          - text
          - image
  devin:
    modelOverrides:
      glm-5-3-flash-1m:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
      swe-2:
        contextWindow: 262000 # 262K * 85% = 222.7K trigger, server-advertised window
        thinking:
          mode: effort
          efforts:
            - medium
            - high
            - max
          defaultLevel: max
          requiresEffort: true
  cmd:
    baseUrl: https://api.commandcode.ai/provider/v1
    api: openai-completions
    discovery:
      type: openai-models-list
    modelOverrides:
      meta/muse-spark-1.3-contributor:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Muse 1.3's 98.5% MRCR recall zone
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
      deepseek/deepseek-v4.1-flash:
        contextWindow: 1000000 # 1M * 85% = 850K trigger, server-advertised 1M window; catalog max-out 66K
        thinking:
          mode: effort
          efforts:
            - low
            - high
            - max
          defaultLevel: max
        input:
          - text
          - image
  cline-pass:
    baseUrl: https://api.cline.bot/api/v1
    apiKey: CLINE_API_KEY
    api: openai-completions
    models:
      - id: z-ai/glm-5.3-flash
        name: GLM 5.3 Flash
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
        input:
          - text
          - image
        compat:
          thinkingFormat: zai
          supportsDeveloperRole: false
    modelOverrides:
      glm-5.3-flash:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
  opencode-zen-jev:
    # Zen serves Jev over native System One (POST {baseUrl}/v1/systemone); its catalog/cliproxy rows are chat-only.
    # Free tier needs a Zen account key (keyless is rejected); reuse the /login opencode-zen credential.
    baseUrl: https://opencode.ai/zen
    apiKey: "!omp token opencode-zen"
    api: typesafe
    models:
      - id: jev-1.13-free
        name: Jev 1.13 (Zen free)
        input:
          - text
        supportsTools: false
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
  openai-codex:
    baseUrl: https://chatgpt.com/backend-api/codex
    api: openai-codex-responses
    auth: oauth
    models:
      - id: gpt-6-astra
        name: GPT-6 Astra
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Astra's 100% needle-and-aggregation zone
        reasoning: true
        input:
          - text
          - image

