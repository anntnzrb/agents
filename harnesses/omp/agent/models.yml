providers:
  cliproxy:
    baseUrl: ${CLIPROXY_CLIENT_BASE_URL}
    apiKey: "keyless"
    api: openai-responses
    discovery:
      type: openai-models-list
    modelOverrides:
      # Keep the GPT-5.6 aliases at the 272K operating point.
      chatgpt/nnn-gpt-5.6-luna-max:
        contextWindow: 272000
      chatgpt/nnn-gpt-5.6-luna-max-fast:
        contextWindow: 272000
      chatgpt/nnn-gpt-5.6-sol-high:
        contextWindow: 272000
      chatgpt/nnn-gpt-5.6-terra-max:
        contextWindow: 272000
      chatgpt/nnn-gpt-5.6-terra-max-fast:
        contextWindow: 272000
  cline-api:
    baseUrl: https://api.cline.bot/api/v1
    apiKey: CLINE_API_KEY
    api: openai-completions
    models:
      - id: deepseek/deepseek-v4-flash
        name: DeepSeek V4 Flash (Cline Free)
        maxTokens: 384000
        cost:
          input: 0.14
          output: 0.28
          cacheRead: 0.0028
          cacheWrite: 0
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          supportsToolChoice: false
          extraBody:
            thinking:
              type: enabled
          reasoningContentField: reasoning_content
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
