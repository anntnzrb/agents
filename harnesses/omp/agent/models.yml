providers:
  google-antigravity:
    modelOverrides:
      gemini-3.7-flash:
        contextWindow: 500000
      gemini-3.7-flash:thinking:
        contextWindow: 500000
      gemini-3.8-flash:
        contextWindow: 500000
      gemini-3.8-flash:thinking:
        contextWindow: 500000
  cline-pass:
    baseUrl: https://api.cline.bot/api/v1
    apiKey: CLINE_API_KEY
    api: openai-completions
    models:
      - id: z-ai/glm-5.3-flash
        name: GLM 5.3 Flash
        contextWindow: 1000000
        maxTokens: 8192
        reasoning: true
        input:
          - text
          - image
        compat:
          thinkingFormat: zai
          supportsDeveloperRole: false
  openai-codex:
    baseUrl: https://chatgpt.com/backend-api/codex
    api: openai-codex-responses
    auth: oauth
    models:
      - id: gpt-6-astra
        name: GPT-6 Astra
        contextWindow: 600000 # 600K window triggers auto-compaction at 85% (~510K tokens), preserving Astra's 100% recall zone
        maxTokens: 131072
        reasoning: true
        input:
          - text
          - image
