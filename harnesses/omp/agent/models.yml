providers:
  google-antigravity:
    modelOverrides:
      gemini-3.7-flash:
        contextWindow: 500000 # 500K * 85% = 425K trigger, keeping Flash within high-precision reasoning limits
      gemini-3.7-flash:thinking:
        contextWindow: 500000
      gemini-3.8-flash:
        contextWindow: 500000 # 500K * 85% = 425K trigger
      gemini-3.8-flash:thinking:
        contextWindow: 500000
  opencode-go:
    modelOverrides:
      glm-5.3-flash:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
      muse-spark-1.3-contributor:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Muse 1.3's 98.5% MRCR recall zone
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
  devin:
    modelOverrides:
      glm-5-3-flash-1m:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
  cmd:
    baseUrl: https://api.commandcode.ai/provider/v1
    api: openai-completions
    discovery:
      type: openai-models-list
    modelOverrides:
      meta/muse-spark-1.3-contributor:
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Muse 1.3's 98.5% MRCR recall zone
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
  cline-pass:
    baseUrl: https://api.cline.bot/api/v1
    apiKey: CLINE_API_KEY
    api: openai-completions
    models:
      - id: z-ai/glm-5.3-flash
        name: GLM 5.3 Flash
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        reasoning: true
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
        input:
          - text
          - image
        compat:
          thinkingFormat: zai
          supportsDeveloperRole: false
    modelOverrides:
      glm-5.3-flash:
        contextWindow: 450000 # 450K * 85% = 382.5K trigger, staying before latent-attention multi-hop degradation
        thinking:
          mode: effort
          efforts:
            - low
            - max
          defaultLevel: low
  openai-codex:
    baseUrl: https://chatgpt.com/backend-api/codex
    api: openai-codex-responses
    auth: oauth
    models:
      - id: gpt-6-astra
        name: GPT-6 Astra
        contextWindow: 600000 # 600K * 85% = 510K trigger, preserving Astra's 100% needle-and-aggregation zone
        reasoning: true
        input:
          - text
          - image

