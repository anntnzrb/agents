# ─────────────────────────────────────────────────────────────────────────────
# 1. MODEL & REASONING (Tab: model)
# ─────────────────────────────────────────────────────────────────────────────

modelRoles:
  default: google-antigravity/gemini-3.7-flash:medium
  smol: google-antigravity/gemini-3.7-flash:medium
  vision: google-antigravity/gemini-3.7-flash:medium
  commit: google-antigravity/gemini-3.7-flash:medium
  tiny: google-antigravity/gemini-3.7-flash:medium
  task: google-antigravity/gemini-3.7-flash:medium
  advisor: google-antigravity/gemini-3.7-flash:medium

  muse: opencode-go/muse-spark-1.3-contributor:xhigh

cycleOrder:
  - default
  - smol
  - muse

modelRoleStorage: global
defaultThinkingLevel: auto
hideThinkingBlock: true
proseOnlyThinking: true
textVerbosity: low

tier:
  openai: priority
  google: priority
  anthropic: none
  subagent: inherit
  advisor: none

retry:
  enabled: true
  maxRetries: 10
  fallbackChains:
    default:
      - google-antigravity/gemini-3.7-flash:medium

advisor:
  enabled: false
  syncBacklog: "off"
  immuneTurns: 3

prewalk:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 2. PROVIDERS & SERVICES (Tab: providers)
# ─────────────────────────────────────────────────────────────────────────────

providers:
  tinyModel: online
  autoThinkingModel: online
  unexpectedStopModel: online
  autoThinkingMaxEffort: max
  memoryModel: online
  webSearchTimeoutSeconds: 120
  webSearchOrder:
    - parallel
    - firecrawl
    - brave
    - exa
  webSearchExclude:
    - gemini
    - codex
    - anthropic
    - xai
    - tavily
    - searxng
    - perplexity
    - google
    - startpage
    - duckduckgo
    - ecosia
    - mojeek
    - public
    - synthetic
    - zai
    - kimi
    - tinyfish
    - kagi
    - jina

exa:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 3. INTERACTION & SESSION BEHAVIOR (Tab: interaction)
# ─────────────────────────────────────────────────────────────────────────────

startup:
  quiet: true
  changelogMode: none
  showSplash: false
  setupWizard: false
  checkUpdate: false

personality: none
steeringMode: all
followUpMode: all
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: no-tools

magicKeywords:
  enabled: true

spelling:
  typoDetection: true
  autocomplete: true
  autocorrect: false

emojiAutocomplete: true

error:
  notify: "on"

recap:
  enabled: false
  idleSeconds: 0

stt:
  enabled: false

speech:
  enabled: false

power:
  sleepPrevention: "off"

features:
  unexpectedStopDetection: mechanical

# ─────────────────────────────────────────────────────────────────────────────
# 4. CONTEXT, COMPACTION & RULES (Tab: context)
# ─────────────────────────────────────────────────────────────────────────────

contextPromotion:
  enabled: false

extendedContext: false

compaction:
  enabled: true
  midTurnEnabled: true
  asyncEnabled: true
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft
  handoffSaveToDisk: true
  supersedeReads: true
  dropUseless: true

snapcompact:
  toolResults: true

ttsr:
  enabled: true
  repeatMode: after-gap
  repeatGap: 40
  builtinRules: true
# ─────────────────────────────────────────────────────────────────────────────
# 5. FILES & EDITING ENGINE (Tab: files)
# -----------------------------------------------------------------------------

read:
  defaultLimit: 300
  renderMarkdown: false
  summarize:
    enabled: true
  toolResultPreview: false

write:
  enabled: true

edit:
  mode: hashline
  fuzzyMatch: true
  blockAutoGenerated: true
  autoRepair:
    enabled: true
  streamingAbort: true

lsp:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 6. SHELL & COMMAND INTERCEPTION (Tab: shell)
# ─────────────────────────────────────────────────────────────────────────────

bash:
  enabled: true
  autoBackground:
    enabled: false
  direnv: auto

shellMinimizer:
  enabled: false

eval:
  py: true
  js: false
  rb: false
  jl: false
  autoBackground:
    enabled: true
    thresholdMs: 10000

python:
  kernelMode: session

bashInterceptor:
  enabled: true
  patterns:
    # --- Upstream Default Tool Redirections ---
    - pattern: "^\\s*(cat|head|tail|less|more)\\s+"
      tool: read
      message: "Use the `read` tool instead of cat/head/tail. It provides better context and handles binary files."
    - pattern: "^\\s*(grep|rg|ripgrep|ag|ack)\\s+"
      tool: grep
      message: "Use the `grep` tool instead of grep/rg. It respects .gitignore and provides structured output."
    - pattern: "^\\s*(find|fd|locate)\\s+.*(-name|-iname|-type|--type|-glob)"
      tool: glob
      message: "Use the `glob` tool instead of find/fd. It respects .gitignore and is faster for glob patterns."
    - pattern: "^\\s*sed\\s+(-i|--in-place)"
      tool: edit
      message: "Use the `edit` tool instead of sed -i. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*perl\\s+.*-[pn]?i"
      tool: edit
      message: "Use the `edit` tool instead of perl -i. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*awk\\s+.*-i\\s+inplace"
      tool: edit
      message: "Use the `edit` tool instead of awk -i inplace. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*(echo|printf|cat\\s*<<)\\s+(?:(?:[^\"'>]|\"[^\"]*\"|'[^']*')|(?<!\\|)>{1,2}\\|?\\s*(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\\s;&|]|$))*(?<!\\|)>{1,2}\\|?\\s*(?!(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\\s;&|]|$))[$\\w./~\"'-]"
      tool: write
      message: "Use the `write` tool instead of echo/cat redirection. It handles encoding and provides confirmation."

    # --- Custom Python / uv Invariants ---
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pip-compile|pip-sync|pipdeptree)(?:\\.exe)?\\b"
      flags: i
      tool: bash
      message: "pip-tools style commands are disabled. Load the active language skill selected from the task artifacts and repository, then use `uv pip compile`, `uv pip sync`, or uv-native project commands."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pip(?:[23])?(?:\\.\\d+)*(?:\\.exe)?|pipx(?:\\.exe)?)\\b"
      flags: i
      tool: bash
      message: "pip/pipx is disabled. Load the active language skill selected from the task artifacts and repository, then use uv workflow (`uv add`, `uv pip`, `uv run --with`, `uv tool`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pythonw?(?:[23])?(?:\\.\\d+)*|py|pypy3?)\\b[^\\n;|&]*(?:\\s-m\\s*(?:pip|venv|virtualenv|ensurepip|py_compile|compileall|build|twine)\\b|\\s-m(?:pip|venv|virtualenv|ensurepip|py_compile|compileall|build|twine)\\b)"
      flags: i
      tool: bash
      message: "`python -m ...` Python tooling is disabled. Load the active language skill selected from the task artifacts and repository, then use uv workflow (`uv run`, `uv pip`, `uv build`, `uv publish`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pythonw?(?:[23])?(?:\\.\\d+)*|py|pypy3?)\\b[^\\n;|&]*\\bsetup\\.py\\b"
      flags: i
      tool: bash
      message: "`python setup.py ...` is disabled. Load the active language skill selected from the task artifacts and repository, then use PEP 517/uv workflow (`uv build`, `uv publish`, `uv sync`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pythonw?(?:[23])?(?:\\.\\d+)*(?:\\.exe)?|py(?:\\.exe)?|pypy(?:3)?(?:\\.exe)?)\\b"
      flags: i
      tool: bash
      message: "Direct Python execution is disabled. Load the active language skill selected from the task artifacts and repository, then use uv workflow (`uv run`, `uv run --with`, `uv add`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:conda|hatch|mamba|micromamba|pdm|pipenv|poetry|rye|virtualenv|pyenv)(?:\\.exe)?\\b"
      flags: i
      tool: bash
      message: "Python env/package/version tooling is disabled. Load the active language skill selected from the task artifacts and repository, then use uv workflow (`uv python`, `uv sync`, `uv add`, `uv run`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:twine|flit)(?:\\.exe)?\\b"
      flags: i
      tool: bash
      message: "Python publish/build tooling is disabled. Load the active language skill selected from the task artifacts and repository, then use uv workflow (`uv build`, `uv publish`)."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:pytest|py\\.test|tox|nox|coverage|mypy|pyright|ruff|black|isort|flake8|pylint|ipython|jupyter|jupyter-lab|jupyter-notebook|notebook)(?:\\.exe)?\\b"
      flags: i
      tool: bash
      message: "Python CLI tools must run through uv. Load the active language skill selected from the task artifacts and repository, then use `uv run <tool>`, `uvx <tool>`, or `uv tool run <tool>`."

    # --- Windows / PowerShell Safety & Path Invariants ---
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:(?:[A-Za-z]:)?(?:\\\\|/)(?:[^\\s;&|]*(?:\\\\|/))?|(?:\\.\\.?)(?:\\\\|/))?(?:pwsh|pwsh\\.exe|powershell|powershell\\.exe)\\b(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+(?:--?|/)(?:e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand|ea|encodeda|encodedar|encodedarg|encodedargu|encodedargum|encodedargume|encodedargumen|encodedargument|encodedarguments)\\b"
      flags: i
      tool: bash
      message: "Opaque PowerShell payloads are blocked. Use an explicit script with `-Command`, or write a temporary `.ps1` under PowerShell temp and run it with `-File`."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:(?:[A-Za-z]:)?(?:\\\\|/)(?:[^\\s;&|]*(?:\\\\|/))?|(?:\\.\\.?)(?:\\\\|/))?(?:pwsh|pwsh\\.exe|powershell|powershell\\.exe)\\b(?!(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+--?NoProfile\\b)(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+(?:--?|/)(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)\\b"
      flags: i
      tool: bash
      message: "PowerShell from OMP bash must include `-NoProfile`. Use `pwsh.exe -NoProfile -NoLogo -NonInteractive -Command '...'`, or a temporary `.ps1` under PowerShell temp with `-File` for multiline scripts."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:(?:[A-Za-z]:)?(?:\\\\|/)(?:[^\\s;&|]*(?:\\\\|/))?|(?:\\.\\.?)(?:\\\\|/))?(?:pwsh|pwsh\\.exe|powershell|powershell\\.exe)\\b(?!(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+--?NonInteractive\\b)(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+(?:--?|/)(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)\\b"
      flags: i
      tool: bash
      message: "PowerShell from OMP bash must include `-NonInteractive`. Use `pwsh.exe -NoProfile -NoLogo -NonInteractive -Command '...'`, or a temporary `.ps1` under PowerShell temp with `-File` for multiline scripts."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:(?:[A-Za-z]:)?(?:\\\\|/)(?:[^\\s;&|]*(?:\\\\|/))?|(?:\\.\\.?)(?:\\\\|/))?(?:pwsh|pwsh\\.exe|powershell|powershell\\.exe)\\b(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+(?:--?|/)(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)\\s+\""
      flags: i
      tool: bash
      message: "Do not wrap PowerShell `-Command` in Bash double quotes. Bash will eat `$`, backticks, and backslashes. Use single quotes around the script, or write a temporary `.ps1` under PowerShell temp and run it with `-File`."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cp|mv|rm|touch|mkdir)\\b[^\\n]*(?:[A-Za-z]:\\\\|\\\\\\\\)"
      flags: i
      tool: bash
      message: "Do not aim POSIX shell commands at Windows `C:\\...` or UNC paths. Use OMP `read`/`search`/`find`/`edit`/`write`, or run PowerShell with `-LiteralPath`."
    - pattern: "(?:^|[;&|]\\s*)\\s*(?:Start-Process|Invoke-Item|Out-GridView|Show-Command|saps|ii|ogv|shcm|explorer(?:\\.exe)?|mshta(?:\\.exe)?|rundll32(?:\\.exe)?)\\b|(?:^|[;&|]\\s*)\\s*(?:sudo\\s+|env\\s+)*(?:[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:(?:[A-Za-z]:)?(?:\\\\|/)(?:[^\\s;&|]*(?:\\\\|/))?|(?:\\.\\.?)(?:\\\\|/))?(?:pwsh|pwsh\\.exe|powershell|powershell\\.exe)\\b(?:(?!\\s+(?:--?|/)(?:(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)|f(?:i(?:l(?:e)?)?)?)\\b)[^\\n])*\\s+(?:--?|/)(?:c(?:o(?:m(?:m(?:a(?:n(?:d)?)?)?)?)?|wa)?|commandwithargs)\\b[^\\n]*(?:Start-Process|Invoke-Item|Out-GridView|Show-Command|saps|start|ii|ogv|shcm|explorer(?:\\.exe)?|mshta(?:\\.exe)?|rundll32(?:\\.exe)?)\\b|(?:^|[;&|]\\s*)\\s*cmd(?:\\.exe)?\\s+/[ck]\\s+start\\b"
      flags: i
      tool: bash
      message: "GUI and URL launches from shell are blocked here. If you really need that, make the intent explicit and use the right tool or user-approved flow."
    - pattern: "^\\s*(?:Get-ChildItem|Get-Content|Set-Location|Copy-Item|Move-Item|Remove-Item|Rename-Item|New-Item|Set-Content|Add-Content|Out-File|Select-String|Where-Object|ForEach-Object|Test-Path|Resolve-Path|Get-Item|Select-Object|Measure-Object)\\b"
      flags: i
      tool: bash
      message: "This is PowerShell syntax, not Bash. In OMP bash on Windows, invoke `pwsh.exe -NoProfile -NoLogo -NonInteractive -Command 'try { [Console]::OutputEncoding=[System.Text.Encoding]::UTF8 } catch {}; <script>'`, or use a temporary `.ps1` under PowerShell temp with `-File` for quote-heavy commands."

# ─────────────────────────────────────────────────────────────────────────────
