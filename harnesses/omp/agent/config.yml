# Only non-default values belong here; a key restating its default pins it against upstream changes.
# Exception: defaults deliberately pinned with a comment explaining why.

# ─────────────────────────────────────────────────────────────────────────────
# 1. MODEL & REASONING (Tab: model)
# ─────────────────────────────────────────────────────────────────────────────

modelRoles:
  default: "@opus"
  slow: cliproxy/gpt-6.1-sol:xhigh
  smol: "@gem"
  vision: "@gem"
  commit: "@gem"
  task: "@sol"
  advisor: "@gem"
  tiny: local/lfm2.5-230m,@gem
  web: web/parallel
  judge: opencode-zen-jev/jev-1.13-free

  opus: cliproxy/claude-opus-5-5:medium
  sonnet: cliproxy/claude-sonnet-5-5:high
  gem: cliproxy/gemini-3.8-flash-high:medium
  muse: cliproxy/opencode-go/muse-spark-1.3-contributor:xhigh
  sol: cliproxy/gpt-6.1-sol:medium
  luna: cliproxy/gpt-6-luna:xhigh
  swe: cliproxy/devin/swe-2:max

cycleOrder:
  - default
  - opus
  - sonnet
  - sol
  - luna
  - muse
  - gem
  - swe

defaultThinkingLevel: auto
hideThinkingBlock: true
textVerbosity: low

tier:
  google: priority

retry:
  maxRetries: 50
  # fallbackChains:
  #   default:
  #     - cliproxy/gemini-3.8-flash-high:medium
  fallbackChains:
    web:
      - web/firecrawl
      - web/brave
      - web/ollama

# ─────────────────────────────────────────────────────────────────────────────
# 2. PROVIDERS & SERVICES (Tab: providers)
# ─────────────────────────────────────────────────────────────────────────────

providers:
  webSearchTimeoutSeconds: 120
  tinyModelDevice: mlx

exa:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 3. INTERACTION & SESSION BEHAVIOR (Tab: interaction)
# ─────────────────────────────────────────────────────────────────────────────

startup:
  quiet: true
  changelogMode: hidden
  setupWizard: false
  checkUpdate: false

personality: none
steeringMode: all
followUpMode: all
doubleEscapeAction: tree
treeFilterMode: no-tools

spelling:
  autocomplete: smollm

error:
  notify: "on"

recap:
  enabled: false

features:
  # Pinned at its default: smart misreads "say X and I'll do Y" handoffs as stalls (Jev 1.13: 0.53-0.78 >= 0.5 threshold) and injects retry nudges
  unexpectedStopDetection: mechanical

# ─────────────────────────────────────────────────────────────────────────────
# 4. CONTEXT, COMPACTION & RULES (Tab: context)
# ─────────────────────────────────────────────────────────────────────────────

compaction:
  idleEnabled: true
  idleTimeoutSeconds: 60
  thresholdPercent: 85
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft
  handoffSaveToDisk: true

branchSummary:
  enabled: true

ttsr:
  repeatMode: after-gap
  repeatGap: 40

# ─────────────────────────────────────────────────────────────────────────────
# 5. FILES & EDITING ENGINE (Tab: files)
# ─────────────────────────────────────────────────────────────────────────────

edit:
  autoRepair:
    enabled: true
  modelVariants:
    gemini-3.8-flash: replace

lsp:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 6. SHELL & COMMAND INTERCEPTION (Tab: shell)
# ─────────────────────────────────────────────────────────────────────────────

bash:
  autoBackground:
    thresholdMs: 5000
  gitGuard: true

shellMinimizer:
  enabled: false

eval:
  js: false
  autoBackground:
    enabled: true
    thresholdMs: 5000

# ─────────────────────────────────────────────────────────────────────────────
# 7. TOOLS & CAPABILITIES (Tab: tools)
# ─────────────────────────────────────────────────────────────────────────────

tools:
  xdev: true
  # builtins: core xd:// docs stay inline; browser exceeds the 10k-char per-device cap and loads on demand
  xdevDocs: builtins
  intentTracing: false
  restrictedFolders:
    - ~/.ssh
    - ~/.config/sops

astEdit:
  enabled: false

find:
  enabled: "off"

web_search:
  enabled: false

browser:
  relay: true
  cmux: false

ask:
  timeout: 600

todo:
  remindersMax: 2

debug:
  enabled: false

checkpoint:
  enabled: true

github:
  enabled: true

security:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# 8. TASKS & SUBAGENTS (Tab: tasks)
# ─────────────────────────────────────────────────────────────────────────────

task:
  showResolvedModelBadge: true
  agentModelOverrides:
    sonic: "@smol"              # Vibe 'fast' tier worker
    scout: "@smol"              # Fast read-only codebase explorer
    task: "@task"               # Vibe 'good' tier worker
    reviewer: "@task"           # Code review on the worker model; the director judges findings
    security-reviewer: "@task"  # Security review on the worker model
  isolation:
    enabled: true
    merge: branch
    commits: ai

plan:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 9. MEMORY & AUTO-LEARN (Tab: memory)
# ─────────────────────────────────────────────────────────────────────────────

autolearn:
  enabled: true
  # Pinned at its default: an automatic capture turn would run on main agent after every task
  autoContinue: false

# ─────────────────────────────────────────────────────────────────────────────
# 10. APPEARANCE, DISPLAY & THEME (Tab: appearance)
# ─────────────────────────────────────────────────────────────────────────────

theme:
  light: ef-elea-light
  dark: dark-volcanic

composer:
  shape: pi
  tokenRate: true

symbolPreset: nerd

statusLine:
  preset: custom
  leftSegments: [pi, vim, model, mode, collab, stream, path, git, pr, context_pct, cost]
  rightSegments: [cache_hit, session_name]
  separator: ascii
  compactThinkingLevel: false
  showHookStatus: false

terminal:
  showProgress: true
  showImages: false

display:
  cacheMissMarker: true

tui:
  renderMermaid: false

# ─────────────────────────────────────────────────────────────────────────────
# 11. EXTENSIBILITY & SYSTEM
# ─────────────────────────────────────────────────────────────────────────────

mcp:
  enableProjectConfig: false
  renderMarkdownResults: false

commands:
  enableClaudeProject: false
  enableOpencodeProject: false

dev:
  autoqa: false

# ─────────────────────────────────────────────────────────────────────────────
# 12. COLLABORATION & REMOTE ACCESS
# ─────────────────────────────────────────────────────────────────────────────

collab:
  webUrl: https://my.omp.sh
  displayName: джаг
setupVersion: 2
