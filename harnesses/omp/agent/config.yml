  intentTracing: false
  approvalMode: yolo

grep:
  enabled: true

glob:
  enabled: true

astGrep:
  enabled: false

astEdit:
  enabled: false

fetch:
  enabled: true

web_search:
  enabled: false

browser:
  enabled: false
  cmux: false

ask:
  enabled: true
  timeout: 600

todo:
  enabled: true
  eager: default
  reminders: true
  remindersMax: 2

debug:
  enabled: false

hub:
  enabled: false

launch:
  enabled: false

async:
  enabled: false

checkpoint:
  enabled: true

vault:
  enabled: false

github:
  enabled: false

security:
  enabled: false

inspect_image:
  mode: auto

generate_image:
  enabled: false

speechgen:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 8. TASKS & SUBAGENTS (Tab: tasks)
# ─────────────────────────────────────────────────────────────────────────────

task:
  enabled: false
  showResolvedModelBadge: false
  eager: false
  batch: false
  enableEffort: false
  enableLsp: false
  prewalk: false
  agentModelOverrides:
    sonic: "@smol"   # Vibe 'fast' tier worker
    task: "@task"    # Vibe 'good' tier worker
