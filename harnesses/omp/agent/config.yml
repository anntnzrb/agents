  separator: ascii
  transparent: false
  compactThinkingLevel: false
  showHookStatus: false

terminal:
  showProgress: true
  showImages: false

display:
  hideToolActivity: false
  showTokenUsage: false
  cacheMissMarker: true

tui:
  imeSafeCursor: false
  renderMermaid: false

