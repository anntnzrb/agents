# ─────────────────────────────────────────────────────────────────────────────
# 1. MODEL & REASONING (Tab: model)
# ─────────────────────────────────────────────────────────────────────────────

modelRoles:
  default: devin/swe-2:max
  smol: devin/swe-2:max
  vision: cliproxy/gemini-3.8-flash-high:high
  commit: devin/swe-2:max
  tiny: cliproxy/gemini-3.7-flash-high:medium
  task: devin/swe-2:max
  advisor: cliproxy/gemini-3.8-flash-high:high
  slow: devin/swe-2:max

  ds-flash: command-code/deepseek/deepseek-v4.1-flash:max
  swe: devin/swe-2:max
  muse: opencode-go/muse-spark-1.3-contributor:xhigh
  astra: cliproxy/gpt-6-astra:low

cycleOrder:
  - default
  - smol
  - astra
  - muse
  - swe
  - ds-flash

modelRoleStorage: global
defaultThinkingLevel: auto
hideThinkingBlock: true
proseOnlyThinking: true
textVerbosity: low

tier:
  openai: none
  google: priority
  anthropic: none
  subagent: inherit
  advisor: none

retry:
  enabled: true
  maxRetries: 50
  maxDelayMs: 300000
  # fallbackChains:
  #   default:
  #     - cliproxy/gemini-3.7-flash-high:medium

advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 3

prewalk:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 2. PROVIDERS & SERVICES (Tab: providers)
# ─────────────────────────────────────────────────────────────────────────────

providers:
  tinyModel: online
  autoThinkingModel: online
  unexpectedStopModel: online
  autoThinkingMaxEffort: max
  memoryModel: online
  webSearchTimeoutSeconds: 120
  webSearchOrder:
    - parallel
    - firecrawl
    - brave
    - exa
  webSearchExclude:
    - gemini
    - codex
    - anthropic
    - xai
    - tavily
    - searxng
    - perplexity
    - google
    - startpage
    - duckduckgo
    - ecosia
    - mojeek
    - public
    - synthetic
    - zai
    - kimi
    - tinyfish
    - kagi
    - jina

exa:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 3. INTERACTION & SESSION BEHAVIOR (Tab: interaction)
# ─────────────────────────────────────────────────────────────────────────────

startup:
  quiet: true
  changelogMode: hidden
  showSplash: false
  setupWizard: false
  checkUpdate: false

personality: none
steeringMode: all
followUpMode: all
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: no-tools

magicKeywords:
  enabled: true

spelling:
  typoDetection: true
  autocomplete: true
  autocorrect: false

emojiAutocomplete: true

error:
  notify: "on"

recap:
  enabled: false
  idleSeconds: 0

stt:
  enabled: false

speech:
  enabled: false

power:
  sleepPrevention: "off"

features:
  unexpectedStopDetection: mechanical

# ─────────────────────────────────────────────────────────────────────────────
# 4. CONTEXT, COMPACTION & RULES (Tab: context)
# ─────────────────────────────────────────────────────────────────────────────

contextPromotion:
  enabled: false

extendedContext: false

compaction:
  enabled: true
  midTurnEnabled: true
  asyncEnabled: true
  idleEnabled: true
  idleTimeoutSeconds: 60
  idleThresholdTokens: 200000
  thresholdPercent: 85
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft
  handoffSaveToDisk: true
  supersedeReads: true
  dropUseless: true

snapcompact:
  toolResults: true

ttsr:
  enabled: true
  repeatMode: after-gap
  repeatGap: 40
  builtinRules: true
# ─────────────────────────────────────────────────────────────────────────────
# 5. FILES & EDITING ENGINE (Tab: files)
# -----------------------------------------------------------------------------

read:
  defaultLimit: 300
  renderMarkdown: false
  summarize:
    enabled: true
  toolResultPreview: false

edit:
  mode: hashline
  fuzzyMatch: true
  blockAutoGenerated: true
  autoRepair:
    enabled: true
  streamingAbort: true

lsp:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 6. SHELL & COMMAND INTERCEPTION (Tab: shell)
# ─────────────────────────────────────────────────────────────────────────────

bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 5000
  direnv: auto

shellMinimizer:
  enabled: false

eval:
  py: true
  js: false
  autoBackground:
    enabled: true
    thresholdMs: 5000
python:
  kernelMode: session

# ─────────────────────────────────────────────────────────────────────────────
# 7. TOOLS & CAPABILITIES (Tab: tools)
# ─────────────────────────────────────────────────────────────────────────────

tools:
  xdev: false
  intentTracing: false
  approvalMode: yolo

grep:
  enabled: true

glob:
  enabled: true

astGrep:
  enabled: false

astEdit:
  enabled: false

fetch:
  enabled: true

web_search:
  enabled: false

browser:
  enabled: true
  relay: true
  headless: true
  cmux: false

computer:
  enabled: false
  display: all
ask:
  enabled: true
  timeout: 600

todo:
  enabled: true
  eager: default
  reminders: true
  remindersMax: 2

debug:
  enabled: false

launch:
  enabled: true

async:
  enabled: true

checkpoint:
  enabled: true

vault:
  enabled: false

github:
  enabled: false

security:
  enabled: false

generate_image:
  enabled: false

speechgen:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 8. TASKS & SUBAGENTS (Tab: tasks)
# ─────────────────────────────────────────────────────────────────────────────

task:
  showResolvedModelBadge: true
  eager: default
  batch: true
  maxConcurrency: 8
  enableEffort: false
  enableLsp: false
  prewalk: false
  agentModelOverrides:
    sonic: "@smol"              # Vibe 'fast' tier worker
    scout: "@smol"              # Fast read-only codebase explorer
    task: "@task"               # Vibe 'good' tier worker
    reviewer: "@slow"           # Deep code review specialist
    security-reviewer: "@slow"  # Security analysis specialist
  isolation:
    enabled: true
    apply: true
    merge: branch
    commits: ai

isolation:
  backend: auto

plan:
  enabled: false
  defaultOnStartup: false

goal:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# 9. MEMORY & AUTO-LEARN (Tab: memory)
# ─────────────────────────────────────────────────────────────────────────────

memory:
  backend: off

memories:
  enabled: false

autolearn:
  enabled: false
  # EXPERIMENTAL: Automatically triggers a post-turn capture pass to codify managed skills; consumes extra tokens.
  autoContinue: false

# ─────────────────────────────────────────────────────────────────────────────
# 10. APPEARANCE, DISPLAY & THEME (Tab: appearance)
# ─────────────────────────────────────────────────────────────────────────────

theme:
  light: light-gruvbox
  dark: dark-volcanic

composer:
  shape: pi

symbolPreset: nerd
colorBlindMode: false

statusLine:
  preset: default
  separator: ascii
  transparent: false
  compactThinkingLevel: false
  showHookStatus: false

terminal:
  showProgress: true
  showImages: false

display:
  hideToolActivity: false
  showTokenUsage: false
  cacheMissMarker: true

tui:
  imeSafeCursor: false
  renderMermaid: false

# ─────────────────────────────────────────────────────────────────────────────
# 11. EXTENSIBILITY & SYSTEM
# ─────────────────────────────────────────────────────────────────────────────

mcp:
  enableProjectConfig: false
  renderMarkdownResults: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

secrets:
  enabled: false

dev:
  autoqa: false

setupVersion: 2
