# ─────────────────────────────────────────────────────────────────────────────
# 1. MODEL & REASONING (Tab: model)
# ─────────────────────────────────────────────────────────────────────────────

modelRoles:
  default: "@opus"
  slow: "@opus"
  smol: "@gem"
  vision: "@gem"
  commit: "@gem"
  task: "@gem"
  advisor: "@gem"
  tiny: local/lfm2.5-230m,@gem
  web: web/parallel
  judge: opencode-zen-jev/jev-1.13-free

  opus: cliproxy/claude-opus-5-5:medium
  sonnet: cliproxy/claude-sonnet-5-5:high
  gem: cliproxy/gemini-3.8-flash-high:medium
  muse: cliproxy/opencode-go/muse-spark-1.3-contributor:xhigh
  astra: cliproxy/gpt-6-astra:medium
  sol: cliproxy/gpt-6.1-sol:medium
  luna: cliproxy/gpt-6-luna:xhigh
  swe: cliproxy/devin/swe-2:max

cycleOrder:
  - default
  - opus
  - sonnet
  - astra
  - sol
  - luna
  - muse
  - gem
  - swe

modelRoleStorage: global
defaultThinkingLevel: auto
hideThinkingBlock: true
proseOnlyThinking: true
textVerbosity: low

tier:
  openai: none
  google: priority
  anthropic: none
  subagent: inherit
  advisor: none

retry:
  enabled: true
  maxRetries: 50
  maxDelayMs: 300000
  # fallbackChains:
  #   default:
  #     - cliproxy/gemini-3.8-flash-high:medium
  fallbackChains:
    web:
      - web/firecrawl
      - web/brave
      - web/exa
      - web/ollama

advisor:
  enabled: false
  syncBacklog: "1"
  immuneTurns: 3

prewalk:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 2. PROVIDERS & SERVICES (Tab: providers)
# ─────────────────────────────────────────────────────────────────────────────

providers:
  webSearchTimeoutSeconds: 120
  tinyModelDevice: mlx

exa:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 3. INTERACTION & SESSION BEHAVIOR (Tab: interaction)
# ─────────────────────────────────────────────────────────────────────────────

startup:
  quiet: true
  changelogMode: hidden
  showSplash: false
  setupWizard: false
  checkUpdate: false

personality: none
steeringMode: all
followUpMode: all
interruptMode: immediate
doubleEscapeAction: tree
treeFilterMode: no-tools

magicKeywords:
  enabled: true

spelling:
  typoDetection: true
  autocomplete: smollm
  autocorrect: false

emojiAutocomplete: true

error:
  notify: "on"

recap:
  enabled: false
  idleSeconds: 0

stt:
  enabled: false

speech:
  enabled: false

power:
  sleepPrevention: "off"

features:
  # smart misreads "say X and I'll do Y" handoffs as stalls (Jev 1.13: 0.53-0.78 >= 0.5 threshold) and injects retry nudges
  unexpectedStopDetection: mechanical

# ─────────────────────────────────────────────────────────────────────────────
# 4. CONTEXT, COMPACTION & RULES (Tab: context)
# ─────────────────────────────────────────────────────────────────────────────

contextPromotion:
  enabled: false

extendedContext: false

compaction:
  enabled: true
  midTurnEnabled: true
  asyncEnabled: true
  idleEnabled: true
  idleTimeoutSeconds: 60
  idleThresholdTokens: 200000
  thresholdPercent: 85
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft
  handoffSaveToDisk: true
  supersedeReads: true
  dropUseless: true

branchSummary:
  enabled: true

snapcompact:
  toolResults: true

ttsr:
  enabled: true
  repeatMode: after-gap
  repeatGap: 40
  builtinRules: true
# ─────────────────────────────────────────────────────────────────────────────
# 5. FILES & EDITING ENGINE (Tab: files)
# -----------------------------------------------------------------------------

read:
  defaultLimit: 300
  renderMarkdown: false
  summarize:
    enabled: true
  toolResultPreview: false

edit:
  mode: hashline
  fuzzyMatch: true
  blockAutoGenerated: true
  autoRepair:
    enabled: true
  streamingAbort: true

lsp:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 6. SHELL & COMMAND INTERCEPTION (Tab: shell)
# ─────────────────────────────────────────────────────────────────────────────

bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 5000
  direnv: auto

shellMinimizer:
  enabled: false

eval:
  py: true
  js: false
  autoBackground:
    enabled: true
    thresholdMs: 5000
python:
  kernelMode: session

# ─────────────────────────────────────────────────────────────────────────────
# 7. TOOLS & CAPABILITIES (Tab: tools)
# ─────────────────────────────────────────────────────────────────────────────

tools:
  xdev: false
  intentTracing: false
  approvalMode: yolo

grep:
  enabled: true

glob:
  enabled: true

astGrep:
  enabled: false

astEdit:
  enabled: false

fetch:
  enabled: true

web_search:
  enabled: false

browser:
  enabled: true
  relay: true
  headless: true
  cmux: false

computer:
  enabled: false
  display: all
ask:
  enabled: true
  timeout: 600

todo:
  enabled: true
  eager: default
  reminders: true
  remindersMax: 2

debug:
  enabled: false

launch:
  enabled: true

async:
  enabled: true

checkpoint:
  enabled: true

vault:
  enabled: false

github:
  enabled: false

security:
  enabled: false

generate_image:
  enabled: false

speechgen:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# 8. TASKS & SUBAGENTS (Tab: tasks)
# ─────────────────────────────────────────────────────────────────────────────

task:
  showResolvedModelBadge: true
  # always: director plans and fans out; workers (@task/@smol) do the implementation
  # eager: always
  batch: true
  maxConcurrency: 32
  enableEffort: false
  enableLsp: false
  prewalk: false
  agentModelOverrides:
    sonic: "@smol"              # Vibe 'fast' tier worker
    scout: "@smol"              # Fast read-only codebase explorer
    task: "@task"               # Vibe 'good' tier worker
    reviewer: "@task"           # Code review on the worker model; the director judges findings
    security-reviewer: "@task"  # Security review on the worker model
  isolation:
    enabled: true
    apply: true
    merge: branch
    commits: ai

isolation:
  backend: auto

plan:
  enabled: false
  defaultOnStartup: false

goal:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# 9. MEMORY & AUTO-LEARN (Tab: memory)
# ─────────────────────────────────────────────────────────────────────────────

memory:
  backend: off

memories:
  enabled: false

autolearn:
  enabled: true
  # Off: an automatic capture turn would run on main agent after every task
  autoContinue: false

# ─────────────────────────────────────────────────────────────────────────────
# 10. APPEARANCE, DISPLAY & THEME (Tab: appearance)
# ─────────────────────────────────────────────────────────────────────────────

theme:
  light: ef-elea-light
  dark: dark-volcanic

composer:
  shape: pi
  tokenRate: true

symbolPreset: nerd
colorBlindMode: false

statusLine:
  preset: custom
  leftSegments: [pi, vim, model, mode, collab, stream, path, git, pr, context_pct, cost]
  rightSegments: [cache_hit, session_name]
  separator: ascii
  transparent: false
  compactThinkingLevel: false
  showHookStatus: false

terminal:
  showProgress: true
  showImages: false

display:
  hideToolActivity: false
  showTokenUsage: false
  cacheMissMarker: true

tui:
  imeSafeCursor: false
  renderMermaid: false

# ─────────────────────────────────────────────────────────────────────────────
# 11. EXTENSIBILITY & SYSTEM
# ─────────────────────────────────────────────────────────────────────────────

mcp:
  enableProjectConfig: false
  renderMarkdownResults: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

secrets:
  enabled: false

dev:
  autoqa: false


# ─────────────────────────────────────────────────────────────────────────────
# 12. COLLABORATION & REMOTE ACCESS
# ─────────────────────────────────────────────────────────────────────────────

collab:
  autoStart: "off"
  relayUrl: wss://my.omp.sh
  webUrl: https://my.omp.sh
  displayName: джаг
setupVersion: 2
