# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

web_search = "live"

# -----------------------------------------------------------------------------
# PERMISSIONS & SANDBOX
# -----------------------------------------------------------------------------

approval_policy = "never"

[ui]
permission_mode = "always-approve"

[sandbox]
mode = "off"

# -----------------------------------------------------------------------------
# MODEL PROVIDERS
# -----------------------------------------------------------------------------

[model_providers.cliproxy]
name = "CLIProxyAPI"
base_url = "${CLIPROXY_CLIENT_BASE_URL}"
wire_api = "responses"
