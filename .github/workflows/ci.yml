name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI uses fixtures and local test servers. No live sources or inference credentials.
env:
  RUN_LIVE_SMOKE: '0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.plan.outputs.skills }}
      skill-shards: ${{ steps.plan.outputs.skill-shards }}
      harnesses: ${{ steps.plan.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            uv run --script .github/scripts/ci.py plan --base "$BASE"
          else
            uv run --script .github/scripts/ci.py plan
          fi

  repository-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: true
          cache-suffix: repository-v2
          cache-python: true
          cache-dependency-glob: |
            .github/**/*.py
            .github/pyproject.toml
            skills/current/skill-creator/scripts/*.py
      - name: Check introduced whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          git diff --check "$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")" HEAD
      - name: Validate workflows
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun test ./.github/tests/offline-bun.test.ts
      - run: uvx ruff==0.16.10 check .github
      - run: uvx ruff==0.16.10 format --check .github
      - run: uvx --python 3.14 --with pytest==9.1.1 basedpyright==1.40.1 -p .github
      - run: uvx --python 3.14 pytest==9.1.1 .github/tests -q
      - run: uvx ruff==0.16.10 check --config sync/pyproject.toml tools/cache-gc
      - run: uvx ruff==0.16.10 format --check --config sync/pyproject.toml tools/cache-gc
      - run: uvx --python 3.14 --with pytest==9.1.1 basedpyright==1.40.1 -p tools/cache-gc
      - run: uvx --python 3.14 pytest==9.1.1 tools/cache-gc/tests -q
      - run: uv run --script .github/scripts/ci.py metadata

  sync-gates:
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and Darwin ARM64 (Apple Silicon), without Intel Macs.
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: true
          cache-suffix: sync-v2
          cache-python: true
          cache-dependency-glob: sync/uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: uv sync --frozen
      - run: uv run --no-sync sync-gates --tests

  skills:
    name: skills (${{ matrix.os }}, shard ${{ matrix.shard.id }})
    needs: plan
    if: needs.plan.outputs.skills != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        shard: ${{ fromJSON(needs.plan.outputs.skill-shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: true
          # A shard must not restore another shard's incomplete immutable cache.
          cache-suffix: skills-v3-${{ matrix.shard.id }}-${{ join(matrix.shard.skills, '-') }}
          cache-python: true
          # Retain source-built wheels without transferring disposable build trees.
          prune-cache: true
          cache-dependency-glob: ${{ matrix.shard.cache-inputs }}
      - name: Run owning skill gates and tests for this shard
        env:
          SKILLS: ${{ toJSON(matrix.shard.skills) }}
        run: uv run --script .github/scripts/ci.py skills

  harnesses:
    needs: plan
    if: needs.plan.outputs.harnesses != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        harness: ${{ fromJSON(needs.plan.outputs.harnesses) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Run harness tests in an isolated copy
        env:
          HARNESS: ${{ matrix.harness }}
        run: uv run --script .github/scripts/ci.py harness "$HARNESS"

  required:
    name: CI required
    needs: [plan, repository-checks, sync-gates, skills, harnesses]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: uv run --script .github/scripts/ci.py required
