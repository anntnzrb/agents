name: upstream

# Opens one issue per ported skill when its upstream release changes the
# directories pinned in skills/current/<skill>/UPSTREAM.json.
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --script .github/scripts/upstream.py --issues-repo "$GITHUB_REPOSITORY"
