name: auto-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Read event and PR data only. Never check out or execute the triggering head.
      - name: Merge checked Dependabot heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          jq -r '.workflow_run.pull_requests[].number' "$GITHUB_EVENT_PATH" | while read -r number; do
            pr=$(gh pr view "$number" --json author,state,isDraft,headRefOid)
            if jq -e --arg sha "$HEAD_SHA" '.author.is_bot == true and .author.login == "app/dependabot" and .state == "OPEN" and .isDraft == false and .headRefOid == $sha' <<< "$pr" >/dev/null; then
              gh pr merge "$number" --merge --match-head-commit "$HEAD_SHA"
              gh workflow run ci.yml --ref main
            fi
          done
