name: live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-sources:
    strategy:
      fail-fast: false
      matrix:
        skill: [deepswe-live, livebench-live, vals-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: true
      - name: Exercise the current public source without credentials
        env:
          RUN_LIVE_SMOKE: '1'
          SKILL: ${{ matrix.skill }}
        run: |
          cd "skills/current/$SKILL"
          uvx --python 3.14 pytest==9.1.1 tests/test_live_smoke.py -q
