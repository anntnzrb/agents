name: Publish Agentium

on:
  push:
    branches:
      - main
    tags:
      - 'agentium-v*'
    paths:
      - 'sync/**'
      - '.github/workflows/publish-package.yml'

concurrency:
  group: publish-agentium-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agentium-check:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/agentium-v')
    name: Check Agentium
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate tag version against Cargo metadata
        if: startsWith(github.ref, 'refs/tags/agentium-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#agentium-v}"
          CARGO_VERSION="$(cargo metadata --format-version 1 --manifest-path sync/Cargo.toml --no-deps | jq -r '.packages[] | select(.name == "app") | .version')"
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo metadata version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - name: Check code formatting
        run: cargo fmt --manifest-path sync/Cargo.toml --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --locked --manifest-path sync/Cargo.toml --workspace --all-targets -- --deny warnings

      - name: Run workspace tests
        run: cargo test --locked --manifest-path sync/Cargo.toml --workspace

  agentium-build:
    if: startsWith(github.ref, 'refs/tags/agentium-v')
    name: Build Agentium (${{ matrix.target }})
    needs: agentium-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --manifest-path sync/Cargo.toml --package app --target ${{ matrix.target }}

      - name: Package release artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#agentium-v}"
          STAGE_DIR="$(mktemp -d)"
          cp "sync/target/${{ matrix.target }}/release/agentium" "$STAGE_DIR/agentium"
          chmod +x "$STAGE_DIR/agentium"
          mkdir -p dist
          TARBALL="agentium-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${TARBALL}" -C "$STAGE_DIR" agentium
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$TARBALL" > "${TARBALL}.sha256"
          else
            shasum -a 256 "$TARBALL" > "${TARBALL}.sha256"
          fi
          cd ..
          rm "$STAGE_DIR/agentium"
          rmdir "$STAGE_DIR"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentium-artifacts-${{ matrix.target }}
          path: dist/
          retention-days: 1

  agentium-release:
    if: startsWith(github.ref, 'refs/tags/agentium-v')
    name: Publish Agentium release
    needs: [agentium-check, agentium-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all Agentium artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agentium-artifacts-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#agentium-v}"
          echo "Publishing Agentium release for $GITHUB_REF_NAME (version $VERSION)..."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets..."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "agentium $VERSION" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
