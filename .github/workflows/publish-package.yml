name: Publish package

on:
  push:
    branches:
      - main
    paths:
      - 'sync/**'
      - '.github/workflows/publish-package.yml'

concurrency:
  group: publish-package-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: sync

      - name: Run checks and tests
        run: |
          bun run check
          bun run typecheck
          bun test
        working-directory: sync

      - name: Build release artifact
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="0.1.${{ github.run_number }}"
          npm version "$PACKAGE_VERSION" --no-git-tag-version
          bun run build
          mkdir -p release
          npm pack --pack-destination release
          printf '{"name":"%s","version":"%s"}\n' "$PACKAGE_NAME" "$PACKAGE_VERSION" > release/metadata.json
        working-directory: sync

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-release
          path: sync/release
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: package-release
          path: release

      - name: Publish package
        run: |
          set -euo pipefail
          test -n "${NODE_AUTH_TOKEN:-}" || {
            echo "NPM_TOKEN repository secret is required" >&2
            exit 1
          }
          PACKAGE_NAME="$(node -p "require('./metadata.json').name")"
          PACKAGE_VERSION="$(node -p "require('./metadata.json').version")"
          NPM_VIEW_ERROR="$(mktemp)"
          trap 'rm -f "$NPM_VIEW_ERROR"' EXIT
          PACKAGE_EXISTS=true
          if CURRENT_LATEST="$(npm view "$PACKAGE_NAME" dist-tags.latest --silent 2>"$NPM_VIEW_ERROR")"; then
            :
          else
            NPM_VIEW_OUTPUT="$(<"$NPM_VIEW_ERROR")"
            case "$NPM_VIEW_OUTPUT" in
              *E404*|*404*) PACKAGE_EXISTS=false; CURRENT_LATEST="" ;;
              *) printf '%s\n' "$NPM_VIEW_OUTPUT" >&2; exit 1 ;;
            esac
          fi
          if [[ "$CURRENT_LATEST" == "undefined" || "$CURRENT_LATEST" == "null" ]]; then
            CURRENT_LATEST=""
          fi
          CANDIDATE_PATCH="${PACKAGE_VERSION##*.}"
          if [[ "$CURRENT_LATEST" =~ ^0\.1\.([0-9]+)$ ]] &&
             (( 10#${BASH_REMATCH[1]} >= 10#$CANDIDATE_PATCH )); then
            echo "Latest version $CURRENT_LATEST is already at or ahead of $PACKAGE_VERSION; skipping."
            exit 0
          fi
          if [[ "$PACKAGE_EXISTS" == true ]]; then
            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --silent >/dev/null 2>"$NPM_VIEW_ERROR"; then
              echo "Version $PACKAGE_VERSION already exists; treating this as a completed rerun."
              exit 0
            fi
            NPM_VIEW_OUTPUT="$(<"$NPM_VIEW_ERROR")"
            case "$NPM_VIEW_OUTPUT" in
              *E404*|*404*) ;;
              *) printf '%s\n' "$NPM_VIEW_OUTPUT" >&2; exit 1 ;;
            esac
          fi
          if [[ -n "$CURRENT_LATEST" ]]; then
            npm dist-tag add "${PACKAGE_NAME}@${CURRENT_LATEST}" previous
          fi
          PACKAGE_FILE="$(printf '%s\n' ./*.tgz)"
          npm publish "$PACKAGE_FILE" --provenance --access public --tag latest
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
