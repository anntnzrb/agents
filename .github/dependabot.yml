version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directories:
      - /sync
      - /skills/current/*
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: bun
    directories:
      - /harnesses/opencode
      - /harnesses/pi/agent/extensions
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Must equal the exact effect version @opencode/plugin depends on; a different
      # version installs a second effect copy whose Schema rejects @opencode schemas.
      - dependency-name: effect
    commit-message:
      prefix: deps
